name: Publish to npmjs

on:
  push:
    tags:
      - v*

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish

